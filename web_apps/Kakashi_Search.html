<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- connect-src lists every endpoint this app is allowed to reach. A script
         injected through a paper title could not exfiltrate to anywhere else. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self';
        style-src 'self';
        img-src 'self' data:;
        font-src 'self';
        connect-src https://generativelanguage.googleapis.com https://router.huggingface.co https://openrouter.ai https://en.wikipedia.org https://api.duckduckgo.com https://api.openalex.org https://hn.algolia.com https://api.crossref.org;
        base-uri 'none';
        form-action 'none';">
    <title>Kakashi Search &mdash; Kusanagi AI</title>
    <meta name="description" content="Kakashi Search — an agentic search engine that breaks queries into sub-tasks and searches Wikipedia, papers, and the web in parallel.">
    <link rel="icon" href="../static/logo-64.png">
    <link rel="stylesheet" href="../static/kusanagi.css">
    <link rel="stylesheet" href="../static/vendor/katex/katex.min.css">
    <script src="../static/vendor/marked.min.js" defer></script>
    <script src="../static/vendor/purify.min.js" defer></script>
    <script src="../static/vendor/katex/katex.min.js" defer></script>
    <script src="../static/vendor/katex/auto-render.min.js" defer></script>
    <script src="../static/keys.js" defer></script>
    <script src="../static/providers.js" defer></script>
    <script src="../static/dom.js" defer></script>
    <script src="../static/ui.js" defer></script>
    <script src="../static/prompts.js" defer></script>
    <script src="../static/pages/kakashi.js" defer></script>
</head>
<body class="h-full bg-primary text-fg-primary font-sans antialiased overflow-hidden flex flex-col">
    <a href="../index.html" class="home-button" aria-label="Back to the Kusanagi AI dashboard">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    </a>

    <!-- HEADER -->
    <header class="flex-shrink-0 h-14 border-b border-tertiary flex items-center justify-between px-4 pl-16 bg-secondary/95 backdrop-blur z-20 gap-3">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-lg font-bold text-fg-primary tracking-tight hidden md:block">
                <a href="../index.html" class="hover:underline">Kusanagi AI</a>
                <span class="text-fg-secondary font-normal mx-1">/</span>
                <button id="reset-search" type="button" class="hover:underline">Kakashi</button>
            </h1>
        </div>

        <div class="flex-1 max-w-2xl hidden" id="header-search-container">
            <div class="relative">
                <label for="header-input" class="sr-only">New search</label>
                <input id="header-input" type="text" autocomplete="off" class="!py-1.5 !pl-4 !pr-12 !rounded-full !bg-primary text-sm" placeholder="New search...">
                <button id="header-go" type="button" class="absolute right-1 top-1 bottom-1 bg-secondary hover:bg-tertiary text-accent rounded-full w-9 flex items-center justify-center transition" aria-label="Search">&rsaquo;</button>
            </div>
        </div>

        <div class="flex items-center gap-3 shrink-0">
            <div class="hidden lg:flex items-center gap-3 text-[10px] font-mono text-fg-secondary bg-primary/50 px-3 py-1 rounded-full border border-tertiary">
                <div><span class="text-accent">RAM:</span> <span id="header-ram">--</span></div>
                <div class="w-px h-3 bg-tertiary"></div>
                <div><span class="text-accent">Tok:</span> <span id="header-tokens">0</span></div>
                <div class="w-px h-3 bg-tertiary"></div>
                <div><span class="text-accent">Spd:</span> <span id="header-speed">--</span></div>
            </div>
            <button id="purge-btn" type="button" class="btn btn-danger text-xs">Purge keys</button>
            <button id="open-settings" type="button" class="btn btn-secondary text-xs">Settings</button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- LEFT: organic results -->
        <section id="organic-column" class="w-full md:w-1/2 overflow-y-auto bg-primary border-r border-tertiary">
            <div id="home-state" class="min-h-full flex flex-col items-center justify-center pb-32 px-4">
                <h2 class="text-4xl md:text-5xl font-bold text-fg-primary mb-6 tracking-tight text-center">Deep search</h2>
                <div class="w-full max-w-xl mb-8">
                    <div class="flex items-center bg-secondary rounded-xl shadow-2xl border border-tertiary overflow-hidden focus-within:border-accent transition-colors">
                        <label for="home-input" class="sr-only">Search query</label>
                        <input id="home-input" type="text" autocomplete="off" class="!border-0 !rounded-none !bg-transparent text-lg !p-4" placeholder="Ask a complex question..." autofocus>
                        <button id="home-go" type="button" class="p-4 bg-accent hover:bg-accent-hover text-secondary font-bold transition shrink-0">GO</button>
                    </div>
                </div>
                <div class="flex flex-wrap justify-center gap-4 text-xs text-fg-secondary">
                    <span>Agentic query expansion</span>
                    <span>Five open databases</span>
                    <span>Keys never leave the browser</span>
                </div>
            </div>

            <div id="results-feed" class="hidden p-4 md:p-6 space-y-4">
                <div class="border-b border-tertiary pb-4 mb-4">
                    <h2 id="query-display" class="text-2xl font-bold text-fg-primary mb-2"></h2>
                    <div class="flex justify-between items-end gap-3">
                        <h3 class="text-sm font-bold text-accent uppercase tracking-wider">Organic results</h3>
                        <span id="result-stats" class="text-[10px] text-fg-secondary font-mono">Searching...</span>
                    </div>
                </div>

                <div id="search-strategy" class="hidden mb-4">
                    <div class="bg-secondary/50 border border-tertiary rounded p-3">
                        <p class="text-[10px] text-fg-secondary font-bold uppercase mb-2">Agentic strategy</p>
                        <div id="strategy-list" class="space-y-3"></div>
                    </div>
                </div>

                <div id="organic-container" class="space-y-3"></div>
            </div>
        </section>

        <!-- RIGHT: AI panel -->
        <aside id="ai-sidebar" class="hidden md:flex w-1/2 bg-secondary flex-col z-10 shadow-2xl">
            <div class="p-3 border-b border-tertiary bg-secondary/95 backdrop-blur flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-accent rounded-full" aria-hidden="true"></span>
                    <span class="font-bold text-sm text-fg-primary">AI analysis</span>
                </div>

                <div class="flex items-center gap-3">
                    <label for="model-select" class="sr-only">Model</label>
                    <select id="model-select" class="!w-auto !bg-primary !text-xs !p-1.5 max-w-[150px]"></select>

                    <div class="flex items-center gap-1 bg-primary px-2 py-1 rounded border border-tertiary">
                        <label for="temp-slider" class="text-[10px] text-fg-secondary">Temp</label>
                        <input type="range" id="temp-slider" min="0" max="1" step="0.1" value="0.7" class="w-12">
                        <span id="temp-display" class="text-[10px] text-accent font-mono w-5">0.7</span>
                    </div>
                </div>
            </div>

            <div id="ai-content" class="flex-1 overflow-y-auto p-6">
                <div id="ai-placeholder" class="text-center mt-32 opacity-60">
                    <p class="text-sm text-fg-secondary">Enter a query to start a deep analysis.</p>
                </div>

                <div id="ai-loading" class="hidden space-y-4">
                    <div class="flex items-center gap-2 text-accent text-xs font-mono mb-4">
                        <span class="w-3 h-3 border-2 border-accent border-t-transparent rounded-full animate-spin inline-block" role="status" aria-label="Loading"></span>
                        Synthesising...
                    </div>
                    <div class="h-4 bg-tertiary rounded w-3/4 animate-pulse"></div>
                    <div class="h-4 bg-tertiary rounded w-full animate-pulse"></div>
                    <div class="h-4 bg-tertiary rounded w-5/6 animate-pulse"></div>
                </div>

                <div id="ai-response" class="prose prose-invert hidden leading-relaxed"></div>
            </div>
        </aside>
    </main>
</body>
</html>
