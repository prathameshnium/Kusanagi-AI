<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- worker-src covers the pdf.js worker; blob: is needed because pdf.js
         instantiates its worker from a blob when loaded as a module.
         Ollama is reachable on loopback only -- a remote Ollama URL would be
         blocked here by design. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self';
        style-src 'self';
        img-src 'self' data: blob:;
        font-src 'self';
        worker-src 'self' blob:;
        child-src blob:;
        connect-src 'self' blob: https://generativelanguage.googleapis.com https://api.groq.com https://api-inference.huggingface.co http://localhost:11434 http://127.0.0.1:11434;
        base-uri 'none';
        form-action 'none';">
    <title>Orochimaru RAG &mdash; Kusanagi AI</title>
    <meta name="description" content="Orochimaru — a secure document analyst that loads PDFs directly into browser RAM for private Q&A and summarization.">
    <link rel="icon" href="../static/logo-64.png">
    <link rel="stylesheet" href="../static/kusanagi.css">
    <script src="../static/vendor/marked.min.js" defer></script>
    <script src="../static/vendor/purify.min.js" defer></script>
    <script src="../static/keys.js" defer></script>
    <script src="../static/providers.js" defer></script>
    <script src="../static/dom.js" defer></script>
    <script src="../static/ui.js" defer></script>
    <script src="../static/pages/orochimaru.js" defer></script>
</head>
<body class="h-full bg-primary text-fg-primary font-sans antialiased overflow-hidden">
    <a href="../index.html" class="home-button" aria-label="Back to the Kusanagi AI dashboard">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    </a>

    <div class="flex h-full max-h-screen">

        <!-- === Sidebar === -->
        <aside class="w-72 flex-shrink-0 bg-secondary flex flex-col p-4 border-r border-tertiary overflow-y-auto">
            <div class="px-1 mb-6 mt-12">
                <h1 class="text-xl font-bold flex flex-wrap items-center gap-2">
                    <a href="../index.html" class="hover:underline text-fg-primary">Kusanagi AI</a>
                    <span class="text-fg-secondary font-normal">/</span>
                    <span class="text-accent">Orochimaru</span>
                </h1>
                <p class="text-xs text-fg-secondary mt-1">In-memory RAG over your PDFs</p>
            </div>

            <div class="mb-6">
                <input type="file" id="pdf-upload" accept="application/pdf,.pdf" class="hidden">
                <button id="load-doc" type="button" class="btn btn-accent w-full py-3 flex items-center justify-center gap-2 shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Load document
                </button>
                <p class="text-[10px] text-center text-fg-secondary mt-2 opacity-70">Parsed here. Never uploaded.</p>
            </div>

            <div class="bg-tertiary/30 rounded-lg p-3 mb-4 border border-tertiary">
                <h2 class="text-xs font-bold text-fg-secondary uppercase mb-3">AI settings</h2>
                <div class="mb-3">
                    <label for="model-select" class="block text-[10px] text-fg-secondary mb-1">Model</label>
                    <select id="model-select" class="!bg-primary !text-xs !p-1.5"></select>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] text-fg-secondary mb-1">
                        <label for="temp-slider">Temperature</label>
                        <span id="temp-val" class="text-accent font-mono">0.3</span>
                    </div>
                    <input type="range" id="temp-slider" min="0" max="1" step="0.1" value="0.3" class="w-full">
                </div>
            </div>

            <div class="bg-tertiary/30 rounded-lg p-3 mb-4 border border-tertiary">
                <h2 class="text-xs font-bold text-fg-secondary uppercase mb-2 flex justify-between items-center">
                    System status
                    <span class="w-2 h-2 bg-danger rounded-full" id="status-dot" aria-hidden="true"></span>
                </h2>
                <dl class="space-y-2 text-xs">
                    <div class="flex justify-between gap-2"><dt>AI link</dt><dd id="status-ai" class="text-fg-secondary">Disconnected</dd></div>
                    <div class="flex justify-between gap-2"><dt>Document</dt><dd id="status-doc" class="text-fg-secondary truncate max-w-[110px]">None</dd></div>
                    <div class="flex justify-between gap-2"><dt>Total chunks</dt><dd id="status-chunks" class="text-fg-primary">0</dd></div>
                </dl>
            </div>

            <div class="mb-4 flex-grow flex flex-col min-h-[150px]">
                <h2 class="text-xs font-bold text-fg-secondary uppercase mb-2 flex justify-between items-center">
                    Loaded documents
                    <span id="doc-count" class="text-accent bg-tertiary px-1.5 rounded">0</span>
                </h2>
                <div id="doc-list" class="space-y-1 overflow-y-auto pr-1 flex-grow"></div>
            </div>

            <div id="quick-actions" class="space-y-2 is-dimmed pointer-events-none transition-opacity">
                <button id="action-summarize" type="button" class="w-full text-left px-3 py-2 rounded hover:bg-tertiary text-sm text-fg-primary border border-transparent hover:border-accent transition">
                    Summarise all
                </button>
                <div>
                    <button id="toggle-review" type="button" class="w-full text-left px-3 py-2 rounded hover:bg-tertiary text-sm text-fg-primary border border-transparent hover:border-accent transition flex items-center justify-between" aria-expanded="false" aria-controls="review-menu">
                        <span>Expert review</span>
                        <span aria-hidden="true">&#9662;</span>
                    </button>
                    <div id="review-menu" class="hidden ml-4 mt-1 border-l-2 border-tertiary pl-2 space-y-1"></div>
                </div>
            </div>

            <div class="mt-auto pt-4 border-t border-tertiary flex gap-2">
                <button id="open-settings" type="button" class="btn btn-secondary text-xs flex-1">Configure API</button>
                <button id="purge-btn" type="button" class="btn btn-danger text-xs">Purge</button>
            </div>
        </aside>

        <!-- === Main === -->
        <main class="flex-1 flex flex-col max-h-screen relative bg-primary min-w-0">
            <header class="flex-shrink-0 h-14 border-b border-tertiary flex items-center justify-between px-4 bg-secondary/50 gap-3">
                <div class="flex items-center gap-4 min-w-0">
                    <span class="text-lg font-bold text-fg-primary truncate">Secure workspace</span>
                    <div class="hidden md:flex items-center gap-3 text-[10px] font-mono text-fg-secondary bg-secondary/80 px-3 py-1 rounded border border-tertiary">
                        <div><span class="text-accent">RAM:</span> <span id="perf-ram" class="text-fg-primary">--</span></div>
                        <div class="w-px h-3 bg-tertiary"></div>
                        <div><span class="text-accent">Tokens:</span> <span id="perf-tokens" class="text-fg-primary">0</span></div>
                        <div class="w-px h-3 bg-tertiary"></div>
                        <div><span class="text-accent">Speed:</span> <span id="perf-speed" class="text-fg-primary">--</span></div>
                    </div>
                </div>

                <div class="flex items-center gap-3 shrink-0">
                    <button id="tts-btn" type="button" class="text-fg-secondary hover:text-accent text-sm border border-tertiary rounded px-2 py-1" aria-pressed="false">Read aloud</button>
                    <button id="clear-chat" type="button" class="text-fg-secondary hover:text-danger text-sm">Clear</button>
                </div>
            </header>

            <div id="chat-history" class="flex-grow overflow-y-auto p-4 space-y-6" role="log" aria-live="polite" aria-label="Conversation"></div>

            <div class="flex-shrink-0 p-4 bg-primary border-t border-tertiary">
                <div class="max-w-4xl mx-auto">
                    <div class="flex bg-tertiary rounded-lg border border-tertiary focus-within:border-accent shadow-lg transition-colors">
                        <label for="chat-input" class="sr-only">Question</label>
                        <input id="chat-input" type="text" autocomplete="off" placeholder="Query your documents..." class="!border-0 !bg-transparent !p-3">
                        <button id="send-btn" type="button" class="px-4 text-accent hover:text-fg-primary transition" aria-label="Send">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>
                    <div class="text-center mt-2">
                        <span id="context-indicator" class="text-[10px] text-fg-secondary is-invisible transition-opacity inline-block">
                            Searching local chunks...
                        </span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
