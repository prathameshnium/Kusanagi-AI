<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self';
        style-src 'self';
        img-src 'self' data:;
        font-src 'self';
        connect-src https://generativelanguage.googleapis.com https://api.groq.com https://api-inference.huggingface.co;
        base-uri 'none';
        form-action 'none';">
    <title>AI Visualizer &mdash; Kusanagi AI</title>
    <meta name="description" content="AI Visualizer — see next-word token probabilities and LLM thinking in real-time.">
    <link rel="icon" href="../static/logo-64.png">
    <link rel="stylesheet" href="../static/kusanagi.css">
    <script src="../static/keys.js" defer></script>
    <script src="../static/providers.js" defer></script>
    <script src="../static/dom.js" defer></script>
    <script src="../static/ui.js" defer></script>
    <script src="../static/pages/visualize.js" defer></script>
</head>
<body class="bg-secondary text-fg-primary font-sans antialiased h-full">
    <a href="../index.html" class="home-button" aria-label="Back to the Kusanagi AI dashboard">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    </a>

    <div class="flex h-full">

        <!-- === Sidebar === -->
        <aside class="w-72 flex-shrink-0 bg-secondary flex flex-col p-4 border-r border-tertiary">
            <div class="px-1 mb-6 mt-12">
                <h1 class="text-2xl font-bold flex flex-wrap items-center gap-2">
                    <a href="../index.html" class="hover:underline text-fg-primary">Kusanagi AI</a>
                    <span class="text-fg-secondary font-normal">/</span>
                    <span class="text-accent">Visualizer</span>
                </h1>
                <p class="text-xs text-fg-secondary mt-1">LLM probability inspector</p>
            </div>

            <div class="bg-tertiary/30 rounded-lg p-3 mb-6 border border-tertiary">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-fg-secondary uppercase">Status</span>
                    <span id="status-indicator" class="text-xs font-bold text-danger">Offline</span>
                </div>
                <div class="text-[10px] text-fg-secondary" id="model-display">No provider configured</div>
            </div>

            <div class="space-y-4 mb-6">
                <div>
                    <div class="flex justify-between text-xs text-fg-secondary mb-1">
                        <label for="temp-slider">Temperature</label>
                        <span id="temp-val" class="text-accent font-mono">1.0</span>
                    </div>
                    <input type="range" id="temp-slider" min="0" max="2" step="0.1" value="1.0" class="w-full">
                </div>

                <div>
                    <div class="flex justify-between text-xs text-fg-secondary mb-1">
                        <label for="topk-slider">Top K (suggestions)</label>
                        <span id="topk-val" class="text-accent font-mono">5</span>
                    </div>
                    <input type="range" id="topk-slider" min="1" max="10" step="1" value="5" class="w-full">
                </div>
            </div>

            <div class="mt-auto pt-4 border-t border-tertiary">
                <button id="open-settings" type="button" class="flex items-center gap-2 text-sm text-fg-secondary hover:text-accent transition w-full justify-center p-2 hover:bg-tertiary rounded">
                    Configure API
                </button>
            </div>
        </aside>

        <!-- === Main === -->
        <main class="flex-1 flex flex-col h-full relative bg-primary p-6 min-w-0">
            <div class="flex justify-between items-center mb-6 gap-4">
                <div>
                    <h2 class="text-xl font-bold text-fg-primary">Next token prediction</h2>
                    <p class="text-xs text-fg-secondary">Type below. Click a bar to extend the text along that path.</p>
                </div>
                <button id="clear-text" type="button" class="text-sm text-fg-secondary hover:text-danger transition flex items-center gap-1 border border-tertiary px-3 py-1 rounded hover:bg-secondary shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Clear
                </button>
            </div>

            <div class="flex-1 flex flex-col md:flex-row gap-6 overflow-hidden">
                <div class="flex-1 flex flex-col h-full min-w-0">
                    <div class="flex-1 bg-tertiary/20 rounded-xl border border-tertiary p-4 relative focus-within:border-accent transition-colors flex flex-col">
                        <label for="text-input" class="sr-only">Text to continue</label>
                        <textarea id="text-input" class="w-full h-full bg-transparent text-lg text-fg-primary placeholder-fg-secondary/30 focus:outline-none resize-none font-mono leading-relaxed" placeholder="The future of AI is..." spellcheck="false"></textarea>

                        <button id="predict-now" type="button" class="absolute bottom-4 right-14 btn btn-accent text-xs">
                            Predict
                        </button>

                        <div id="loading" class="hidden absolute bottom-4 right-4 bg-primary/80 rounded-full p-2">
                            <div class="w-5 h-5 border-2 border-accent border-t-transparent rounded-full animate-spin" role="status" aria-label="Loading"></div>
                        </div>
                    </div>
                    <div class="flex justify-between mt-2 px-1">
                        <p class="text-xs text-fg-secondary">Updates automatically when you stop typing.</p>
                        <p class="text-xs text-fg-secondary" id="char-count">0 chars</p>
                    </div>
                </div>

                <div class="w-full md:w-80 flex flex-col bg-secondary rounded-xl border border-tertiary overflow-hidden shrink-0">
                    <div class="p-3 bg-tertiary/30 border-b border-tertiary">
                        <h3 class="text-xs font-bold text-fg-secondary uppercase">Probable next tokens</h3>
                    </div>
                    <div id="prediction-list" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
